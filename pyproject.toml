[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "repodoctor"
version = "2.0.0"
description = "Repository health diagnostic CLI for open-source maintainers"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "repodoctor maintainers"},
]
keywords = ["repository", "health", "diagnostics", "cli", "open-source", "github"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.0",
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/Kubixpro1/repodoctor"
Repository = "https://github.com/Kubixpro1/repodoctor"
Issues = "https://github.com/Kubixpro1/repodoctor/issues"

[project.scripts]
repodoctor = "repodoctor.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["repodoctor*"]

[tool.setuptools.package-data]
repodoctor = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "Q", "S", "UP"]
ignore = ["E501", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/test_demo.py" = ["S603"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
